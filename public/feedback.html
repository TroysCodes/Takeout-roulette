<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Give feedback · Takeout Roulette</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@700;800&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#FBF6EC;--surface:#fff;--fg:#16293B;--muted:#65707D;--blue:#4FA8F0;--ink:#0E2A45;--green:#22D16B;--line:#EEE6D8;--err:#C2412B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px 48px}
.back{display:inline-block;color:var(--muted);font-weight:600;text-decoration:none;margin-bottom:14px}
.back:hover{color:var(--fg)}
h1{font:800 30px/1.1 Gabarito,sans-serif;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 24px}
form,.box{background:var(--surface);border-radius:20px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
label{font-weight:700;display:block;margin-bottom:6px}
input{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
input:focus{outline:none;border-color:var(--blue)}
button{font:700 15px Figtree,sans-serif;border:0;border-radius:999px;padding:11px 18px;cursor:pointer;background:var(--blue);color:var(--ink)}
button.green{background:var(--green);color:#063A1E}
button.plain{background:transparent;color:var(--muted);border:2px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.err{color:var(--err);font-weight:600;margin:10px 0 0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.count{color:var(--muted);font-weight:600}
ul{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:6px}
li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);overflow-wrap:anywhere}
li small{color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--surface);padding:5px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.06);width:max-content;max-width:100%}
.tabs button{background:transparent;color:var(--muted);padding:9px 14px}
.tabs button[aria-selected="true"]{background:var(--blue);color:var(--ink)}
.note{color:var(--muted);font-size:14px;margin:6px 0 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.stats div{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.stats b{font:800 22px/1.1 Gabarito,sans-serif}.stats span{font-size:12px;color:var(--muted)}
h3{font:700 15px Figtree,sans-serif;margin:18px 0 0}
h3 + ul{margin-top:8px}
q{font-style:italic;color:var(--muted)}
textarea{width:100%;min-height:140px;margin-top:12px;font:14px ui-monospace,monospace;border-radius:12px;padding:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
main{max-width:680px}
.box h2{font:800 20px/1.2 Gabarito,sans-serif;margin:22px 0 6px}
.box h2:first-child{margin-top:0}
.box p,.box li{color:var(--fg)}
.box ul{list-style:disc;display:block;margin:6px 0 0;padding-left:22px}
.box li{display:list-item;background:none;padding:2px 0;border-radius:0}
a{color:var(--fg)}
.go-spin{background:var(--blue,#4FA8F0);color:#0E2A45;padding:10px 18px;border-radius:999px;font-weight:800;box-shadow:0 2px 8px rgba(14,42,69,.15)}
.go-spin:hover{color:#0E2A45;filter:brightness(1.05)}
form{background:var(--surface,#fff);border-radius:20px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:6px}
.fb label{font-weight:700;margin-top:8px}
.fb input,.fb textarea{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid #EEE6D8;background:#FBF6EC;color:inherit}
.fb textarea{min-height:180px;resize:vertical}
.fb input:focus,.fb textarea:focus{outline:none;border-color:#4FA8F0}
.fb small{color:#65707D}
.fb .send{margin-top:12px;font:800 16px Figtree,sans-serif;border:0;border-radius:999px;padding:13px 20px;background:#22D16B;color:#063A1E;cursor:pointer}
.fb .send:disabled{opacity:.6}
.fb-err{color:#C2412B;font-weight:600;margin:6px 0 0}
.thanks{background:#fff;border-radius:20px;padding:24px 18px;box-shadow:0 2px 10px rgba(0,0,0,.06);text-align:center}
.thanks b{font:800 22px Gabarito,sans-serif;display:block;margin-bottom:4px}
</style>
</head>
<body>
<main>
  <a class="back go-spin" href="/#pick">🎡 Back to the wheel</a>
  <h1>Give feedback</h1>
  <p class="sub" style="color:#65707D;margin:0 0 20px">Tell us what you think: what you love, what's missing, a restaurant we should add, a bug, anything at all. It goes straight to the founder.</p>
  <form class="fb" id="fb" novalidate>
    <label for="subj">Subject</label>
    <input id="subj" maxlength="120" placeholder="e.g. Add more taco spots" autocomplete="off">
    <label for="msg">Your feedback</label>
    <textarea id="msg" maxlength="3000" placeholder="Write as much as you like…" required></textarea>
    <small id="who">Sent without your name.</small>
    <p class="fb-err" id="err" role="alert" hidden></p>
    <button class="send" id="send" type="submit">Send feedback</button>
  </form>
  <div class="thanks" id="thanks" hidden><b>Thank you! 🙌</b>Your feedback was sent to the founder.<p><a class="back go-spin" href="/#pick">🎡 Back to the wheel</a></p><button type="button" id="again" style="border:0;background:none;color:#65707D;font:600 15px Figtree,sans-serif;text-decoration:underline;cursor:pointer">Send more feedback</button></div>
</main>
<script>
(() => {
const $ = s => document.querySelector(s);
fetch("/api/auth", {credentials: "same-origin"}).then(r => r.json()).then(o => { if (o.user) $("#who").textContent = `Sent from your account (${o.user.email}) so the founder can reply.`; }).catch(() => {});
$("#fb").addEventListener("submit", async e => {
  e.preventDefault(); const err = $("#err"); err.hidden = true;
  const message = $("#msg").value.trim(), subject = $("#subj").value.trim();
  if (message.length < 2){ err.textContent = "Please write your feedback first."; err.hidden = false; $("#msg").focus(); return; }
  $("#send").disabled = true; $("#send").textContent = "Sending…";
  const r = await fetch("/api/feedback", {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: JSON.stringify({subject, message})}).catch(() => null);
  const o = r ? await r.json().catch(() => ({})) : {};
  $("#send").disabled = false; $("#send").textContent = "Send feedback";
  if (!r || !r.ok){ err.textContent = o.error || "Could not send. Check your connection and try again."; err.hidden = false; return; }
  $("#fb").hidden = true; $("#thanks").hidden = false; $("#msg").value = ""; $("#subj").value = "";
});
$("#msg").addEventListener("input", () => $("#err").hidden = true);
$("#again").addEventListener("click", () => { $("#thanks").hidden = true; $("#fb").hidden = false; $("#subj").focus(); });
})();
</script>
</body>
</html>
